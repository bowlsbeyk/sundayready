name: Release

# Cutting a release is pushing a tag. The tag is the version — it is stamped into the build, and
# the in-app updater compares against it.
#
#   v1.2.3          production. Every station takes it.
#   v1.2.3-beta.1   beta. Only stations set to beta or below.
#   v1.2.3-alpha.1  alpha.
#   v1.2.3-dev.4    dev. A machine nobody depends on.
#
# The suffix is the whole mechanism: it goes into the build's InformationalVersion, and the
# updater reads it back to decide who is offered what. See Services/ReleaseChannel.cs.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false

      # One at a time. This was added believing three concurrent jobs were rate-limiting each
      # other on codeload; serialising did not fix that, so the real fix is below — the SDK no
      # longer comes from an action at all. It is kept because it still halves the number of
      # action tarballs being fetched at once, and a release is not a hot path.
      max-parallel: 1

      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Not actions/setup-dotnet. That action is not pre-cached on the runner images, so every
      # job fetches its tarball from codeload — and codeload has been handing out 429s, which
      # kills the job in "Set up job" before any step exists to retry. Three release runs died
      # that way, on whichever platform lost the race. dotnet-install comes from Microsoft's CDN
      # instead, so it does not share that failure, and it is skipped entirely when the runner
      # image already has the SDK.
      - name: Ensure the .NET 9 SDK
        shell: bash
        run: |
          set -euo pipefail
          if command -v dotnet >/dev/null 2>&1 && dotnet --list-sdks | grep -q '^9\.'; then
            echo "SDK 9 already on the image:"
            dotnet --list-sdks
            exit 0
          fi

          echo "No SDK 9 on the image; installing."
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 \
                 https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh; then
              break
            fi
            echo "attempt $attempt to fetch dotnet-install.sh failed"
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done

          bash dotnet-install.sh --channel 9.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --list-sdks

      - name: Derive version and channel from the tag
        id: version
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME}"
          FULL="${RAW#v}"

          # AssemblyVersion cannot hold a prerelease suffix, so the two are tracked separately:
          # NUMERIC goes in Version, FULL goes in InformationalVersion, and the app reads the
          # latter. Keeping them in step is what makes "v0.15.0-beta.1" show up as that in the UI.
          NUMERIC="${FULL%%-*}"

          if ! echo "$NUMERIC" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$RAW' does not start with MAJOR.MINOR.PATCH — the updater cannot compare it." >&2
            exit 1
          fi

          SUFFIX=""
          if [ "$FULL" != "$NUMERIC" ]; then
            SUFFIX="${FULL#*-}"
            if ! echo "$SUFFIX" | grep -Eq '^(beta|alpha|dev)(\.[0-9]+)?$'; then
              echo "Tag '$RAW' has suffix '-$SUFFIX'. Only -beta.N, -alpha.N and -dev.N are channels." >&2
              exit 1
            fi
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          echo "full=$FULL"             >> "$GITHUB_OUTPUT"
          echo "numeric=$NUMERIC"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Building $FULL (prerelease=$PRERELEASE) for ${{ matrix.rid }}"

      - name: Publish self-contained
        shell: bash
        run: |
          dotnet publish src/SundayReady/SundayReady.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version=${{ steps.version.outputs.numeric }} \
            -p:InformationalVersion=${{ steps.version.outputs.full }} \
            -o publish

      # Two Windows assets on purpose. The bare exe is what the in-app updater downloads, so an
      # update never touches a station's own checklists or station.json — they sit beside it. The
      # zip is for setting up a booth PC the first time.
      - name: Stage Windows assets
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item publish/SundayReady.exe "dist/SundayReady-${{ matrix.rid }}.exe"

          New-Item -ItemType Directory -Path bundle | Out-Null
          Copy-Item publish/SundayReady.exe bundle/SundayReady.exe
          Copy-Item -Recurse publish/checklists bundle/checklists
          Copy-Item publish/station.json bundle/station.json
          Compress-Archive -Path bundle/* -DestinationPath "dist/SundayReady-${{ matrix.rid }}.zip"

      # macOS gets one asset, used for both first install and updates. A single-file publish for
      # osx still leaves the Skia, HarfBuzz and Avalonia dylibs beside the binary, so there is no
      # "just the executable" to hand out — the bundle is the unit, and the updater replaces all
      # of it. Which is also why Mac stations keep their checklists outside the bundle.
      - name: Build the .app bundle
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/SundayReady.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp -R publish/. "$APP/Contents/MacOS/"
          rm -f "$APP/Contents/MacOS/"*.pdb
          chmod +x "$APP/Contents/MacOS/SundayReady"

          # png -> icns. sips and iconutil are both part of macOS, so no extra tooling.
          ICONSET="$(mktemp -d)/SundayReady.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z $size $size src/SundayReady/Assets/logo.png \
              --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) src/SundayReady/Assets/logo.png \
              --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/SundayReady.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>SundayReady</string>
            <key>CFBundleDisplayName</key><string>SundayReady</string>
            <key>CFBundleIdentifier</key><string>org.trinitybaptist.sundayready</string>
            <key>CFBundleExecutable</key><string>SundayReady</string>
            <key>CFBundleIconFile</key><string>SundayReady</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.version.outputs.full }}</string>
            <key>CFBundleVersion</key><string>${{ steps.version.outputs.numeric }}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key><true/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc signature. Not notarized — that needs a paid Apple Developer account — but a
          # bundle with no signature at all is refused outright on Apple Silicon, whereas an
          # ad-hoc one runs once the operator clears quarantine. The README says how.
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

          # ditto, not zip: it is the one tool that preserves the symlinks and metadata inside a
          # bundle, and the updater uses ditto to expand it again for the same reason.
          ( cd dist && ditto -c -k --sequesterRsrc --keepParent \
              SundayReady.app "SundayReady-${{ matrix.rid }}.zip" )
          rm -rf "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets and checksum them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;

          # Written outside dist and moved in, so the sums file cannot end up hashing itself.
          ( cd dist && sha256sum * ) > SHA256SUMS.txt
          mv SHA256SUMS.txt dist/
          cat dist/SHA256SUMS.txt

      - name: Work out whether this is a prerelease
        id: kind
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            *-beta*|*-alpha*|*-dev*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)                       echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Straight at the REST API rather than through a release action. Same reason the SDK no
      # longer comes from setup-dotnet: codeload has been answering 429 when the runner fetches
      # an action tarball, and that took out a release run here too. curl and the token that is
      # already in the job cannot fail that way.
      #
      # Written to be safe to re-run: it reuses an existing release for the tag and replaces
      # assets rather than erroring on a duplicate, so a half-finished run can simply be run
      # again.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")

          # curl -f collapses every HTTP error into exit 22 and throws the body away, which is
          # exactly what you need to see when a publish fails. So: capture body and status,
          # print both on failure, and retry — the API has been flaky enough today to earn it.
          #
          # call METHOD URL [curl args...] -> body on stdout, non-zero and a report on failure.
          call() {
            local method="$1" url="$2"; shift 2
            local body status attempt
            for attempt in 1 2 3; do
              body=$(curl -sS -w $'\n%{http_code}' -X "$method" "${auth[@]}" "$@" "$url") || body=$'\n000'
              status="${body##*$'\n'}"
              body="${body%$'\n'*}"

              case "$status" in
                2*) printf '%s' "$body"; return 0 ;;
                404) printf '%s' "$body"; return 4 ;;
                # Retry what is worth retrying; fail fast on a real rejection.
                000|429|5*) echo "  $method $url -> $status (attempt $attempt), retrying" >&2 ;;
                *) echo "  $method $url -> $status" >&2
                   echo "$body" | head -c 2000 >&2
                   return 1 ;;
              esac
              sleep $((attempt * 5))
            done

            echo "  $method $url -> giving up after 3 attempts (last status $status)" >&2
            echo "$body" | head -c 2000 >&2
            return 1
          }

          id=$(call GET "$api/releases/tags/$TAG" | jq -r '.id // empty') || id=""

          if [ -z "$id" ]; then
            id=$(call POST "$api/releases" \
                   -d "$(jq -nc --arg t "$TAG" --argjson p "$PRERELEASE" \
                         '{tag_name:$t, name:$t, prerelease:$p, generate_release_notes:true}')" \
                 | jq -r '.id')
            echo "created release $id for $TAG (prerelease=$PRERELEASE)"
          else
            echo "release $id already exists for $TAG; reusing it"
            call PATCH "$api/releases/$id" \
              -d "$(jq -nc --argjson p "$PRERELEASE" '{prerelease:$p}')" >/dev/null
          fi

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "could not obtain a release id for $TAG" >&2
            exit 1
          fi

          for file in dist/*; do
            name=$(basename "$file")

            old=$(call GET "$api/releases/$id/assets?per_page=100" \
                  | jq -r --arg n "$name" '.[] | select(.name==$n) | .id')
            if [ -n "$old" ]; then
              echo "replacing existing $name"
              call DELETE "$api/releases/assets/$old" >/dev/null
            fi

            echo "uploading $name ($(wc -c <"$file") bytes)"
            call POST "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$id/assets?name=$name" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" >/dev/null
          done

          echo "published $TAG:"
          call GET "$api/releases/$id/assets?per_page=100" | jq -r '.[] | "  \(.name)  \(.size)"'
